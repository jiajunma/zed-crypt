# "zed" is not allowed in registry extension IDs/names, so the extension is
# published as "encrypted-armor" (matching the language it provides) even
# though the repo is named zed-crypt.
id = "encrypted-armor"
name = "Encrypted Armor"
version = "0.1.0"
schema_version = 1
authors = ["Jiajun Ma <hoxide@gmail.com>"]
description = "Transparent editing of armored gpg/age encrypted files (.asc/.age)"
repository = "https://github.com/jiajunma/zed-crypt"

[language_servers.zed-crypt-lsp]
name = "zed-crypt LSP"
languages = ["Encrypted Armor"]
