name: release

# Build zed-crypt-lsp for every supported platform and attach the archives to
# the GitHub release for the pushed tag. The Zed extension downloads these at
# runtime (asset names must stay in sync with extension/src/lib.rs).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zed-crypt-lsp
          target: ${{ matrix.target }}
          manifest-path: lsp/Cargo.toml
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}
